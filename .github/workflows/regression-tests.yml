name: Regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "Open PR number; select the branch at that PR's current head"
        required: true
        type: string
      candidate_url:
        description: "Public candidate deployment URL (site root, no credentials)"
        required: true
        type: string
      reference_url:
        description: "Pinned public reference deployment URL with matching CMS content"
        required: true
        type: string
      baseline_id:
        description: "Reference commit/deployment and matched CMS snapshot identifier"
        required: true
        type: string
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.event_name }}
  cancel-in-progress: true

jobs:
  prepare-comment-command:
    name: Acknowledge regression command
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["/regression-check","/run-regression"]'), github.event.comment.body)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const comment = context.payload.comment;
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login,
            });
            if (!["admin", "maintain", "write"].includes(access.permission)) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: comment.id,
                body: "This regression check can only be run by a repository collaborator with write access.",
              });
              core.setFailed("Commenter needs write access to run the regression check");
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner, repo, pull_number: context.payload.issue.number,
            });
            if (pullRequest.state !== "open" || pullRequest.head.repo?.full_name !== `${owner}/${repo}`) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: comment.id,
                body: "This regression check only runs on open PRs from this repository.",
              });
              core.setFailed("Regression checks do not run for closed or fork PRs");
              return;
            }
            await github.rest.issues.updateComment({
              owner, repo, comment_id: comment.id,
              body: "⏳ Regression check started. I’m checking the PR and preview now; I’ll update this comment with the results.",
            });

  unit:
    name: Source unit tests
    runs-on: ubuntu-latest
    needs: [prepare-comment-command]
    if: ${{ !cancelled() && github.event_name != 'pull_request_target' && (github.event_name != 'issue_comment' || (needs.prepare-comment-command.result == 'success' && github.event.issue.pull_request && contains(fromJSON('["/regression-check","/run-regression"]'), github.event.comment.body))) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn strapi:types:check
      - run: yarn typecheck:images
      - run: yarn test:unit

  astro:
    name: Astro integration tests
    runs-on: ubuntu-latest
    needs: [unit]
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            astro/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd astro install --frozen-lockfile
      - run: yarn --cwd astro typecheck
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:astro

  infrastructure:
    name: Infrastructure self-tests
    runs-on: ubuntu-latest
    needs: [prepare-comment-command, unit]
    if: ${{ !cancelled() && needs.unit.result == 'success' && github.event_name != 'pull_request_target' && (github.event_name != 'issue_comment' || (needs.prepare-comment-command.result == 'success' && github.event.issue.pull_request && contains(fromJSON('["/regression-check","/run-regression"]'), github.event.comment.body))) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - run: yarn test:infrastructure:node
      - run: yarn test:infrastructure:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrastructure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  browser:
    name: Website functionality and advisory comparison
    outputs:
      results_published: ${{ steps.publish-results.outputs.published }}
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' && needs.infrastructure.result == 'success' || github.event_name == 'issue_comment' && needs.infrastructure.result == 'success' && needs.prepare-comment-command.result == 'success' && github.event.issue.pull_request && contains(fromJSON('["/regression-check","/run-regression"]'), github.event.comment.body)) }}
    needs: [infrastructure, prepare-comment-command]
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve and validate comparison targets
        id: targets
        uses: actions/github-script@v7
        env:
          INPUT_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
          INPUT_CANDIDATE_URL: ${{ inputs.candidate_url }}
          INPUT_REFERENCE_URL: ${{ inputs.reference_url }}
          INPUT_BASELINE_ID: ${{ inputs.baseline_id }}
          INPUT_COMMENT_ID: ${{ github.event.comment.id }}
        with:
          script: |
            const { validatePullRequest } = require("./tests/ci/review");
            if (context.eventName === "workflow_dispatch") {
              const pullNumber = await validatePullRequest({
                github, ...context.repo,
                pullNumber: process.env.INPUT_PULL_REQUEST_NUMBER,
                commitSha: context.sha,
              });
              core.setOutput("pull_number", String(pullNumber));
              core.setOutput("candidate_url", process.env.INPUT_CANDIDATE_URL);
              core.setOutput("reference_url", process.env.INPUT_REFERENCE_URL);
              core.setOutput("baseline_id", process.env.INPUT_BASELINE_ID);
              core.setOutput("candidate_commit", context.sha);
            } else {
              const { resolveCommentTargets } = require("./tests/ci/targets");
              const target = await resolveCommentTargets({
                github, ...context.repo,
                pullNumber: context.payload.issue.number,
                actor: context.actor,
              });
              core.setOutput("pull_number", String(target.pullNumber));
              core.setOutput("candidate_url", target.candidateURL);
              core.setOutput("reference_url", target.referenceURL);
              core.setOutput("baseline_id", target.baselineId);
              core.setOutput("candidate_commit", target.candidateCommit);
              core.setOutput("comment_id", String(context.payload.comment.id));
            }
      - name: Expose resolved comparison inputs
        env:
          UI_PULL_REQUEST_NUMBER: ${{ steps.targets.outputs.pull_number }}
          UI_BASE_URL: ${{ steps.targets.outputs.candidate_url }}
          UI_REFERENCE_URL: ${{ steps.targets.outputs.reference_url }}
          UI_BASELINE_ID: ${{ steps.targets.outputs.baseline_id }}
          UI_CANDIDATE_COMMIT: ${{ steps.targets.outputs.candidate_commit }}
          UI_COMMENT_ID: ${{ steps.targets.outputs.comment_id }}
        run: |
          printf 'UI_PULL_REQUEST_NUMBER=%s\n' "$UI_PULL_REQUEST_NUMBER" >> "$GITHUB_ENV"
          printf 'UI_BASE_URL=%s\n' "$UI_BASE_URL" >> "$GITHUB_ENV"
          printf 'UI_REFERENCE_URL=%s\n' "$UI_REFERENCE_URL" >> "$GITHUB_ENV"
          printf 'UI_BASELINE_ID=%s\n' "$UI_BASELINE_ID" >> "$GITHUB_ENV"
          printf 'UI_CANDIDATE_COMMIT=%s\n' "$UI_CANDIDATE_COMMIT" >> "$GITHUB_ENV"
          printf 'UI_COMMENT_ID=%s\n' "$UI_COMMENT_ID" >> "$GITHUB_ENV"
        shell: bash
      - name: Validate comparison PR and selected commit
        uses: actions/github-script@v7
        with:
          script: |
            const { validatePullRequest } = require("./tests/ci/review");
            await validatePullRequest({
              github, ...context.repo,
              pullNumber: process.env.UI_PULL_REQUEST_NUMBER,
              commitSha: process.env.UI_CANDIDATE_COMMIT,
            });
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - name: Validate comparison URLs before recording provenance
        run: node -e 'require("./tests/ui/contracts").validateTargets()'
      - name: Record comparison provenance
        run: |
          printf '## Website comparison\n\nCandidate: %s\n\nReference: %s\n\nBaseline: %s\n\nTest code commit: %s\n' \
            "$UI_BASE_URL" "$UI_REFERENCE_URL" "$UI_BASELINE_ID" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - run: yarn test:ui
      - uses: actions/upload-artifact@v4
        id: website-report
        if: always()
        with:
          name: website-regression-report
          path: |
            playwright-report/
            test-results/
            ui-results.json
          retention-days: 14
      - name: Update regression comment with results
        id: publish-results
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          UI_REPORT_ARTIFACT_URL: ${{ steps.website-report.outputs.artifact-url }}
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const { publishReview } = require("./tests/ci/review");
            const result = await publishReview({
              github, ...context.repo,
              pullNumber: process.env.UI_PULL_REQUEST_NUMBER,
              commentId: process.env.UI_COMMENT_ID,
              commitSha: process.env.UI_CANDIDATE_COMMIT,
              report: JSON.parse(readFileSync("ui-results.json", "utf8")),
              runURL: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              artifactURL: process.env.UI_REPORT_ARTIFACT_URL,
              candidateURL: process.env.UI_BASE_URL,
              referenceURL: process.env.UI_REFERENCE_URL,
              baselineId: process.env.UI_BASELINE_ID,
            });
            await core.summary.addRaw(result.body).write();
            core.setOutput("published", "true");
            if (result.posted) core.notice(`Regression results posted: ${result.commentURL}`);

  report-command-failure:
    name: Update regression command comment if the check cannot finish
    if: always() && github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(fromJSON('["/regression-check","/run-regression"]'), github.event.comment.body) && needs.prepare-comment-command.result == 'success' && (needs.infrastructure.result != 'success' || needs.browser.result != 'success') && needs.browser.outputs.results_published != 'true'
    needs: [infrastructure, browser, prepare-comment-command]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const runURL = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `⚠️ Regression check couldn't finish. See the [workflow run](${runURL}) for the reason.`;
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              body,
            });

  regression-instructions:
    name: Add on-demand regression instructions to the PR
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- on-demand-website-regression -->";
            const number = context.payload.pull_request.number;
            const body = [
              marker,
              "### Run the website regression check",
              "When the PR's Netlify deploy preview is ready, comment `/regression-check` on this PR. The browser comparison runs on demand and checks the PR preview against Netlify's `main` branch deployment.",
              "",
              "This is a quick visual comparison. If page text or photos changed between the main and PR builds, those changes may appear in the report too.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: number, per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === "Bot" && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            }
