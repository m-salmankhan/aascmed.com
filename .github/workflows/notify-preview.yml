name: Notify preview deployment

on:
  workflow_run:
    workflows: [Preview image]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    if: >-
      github.repository == 'm-salmankhan/aascmed.com' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'm-salmankhan/aascmed.com'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ secrets.PREVIEW_APP_ID }}
          private-key: ${{ secrets.PREVIEW_APP_PRIVATE_KEY }}
          owner: Allergy-Asthma-and-Sinus-Centers
          repositories: preview.aascmed.com
          permission-actions: write
      - name: Automatically request deployment of the completed build
        env:
          PREVIEW_TOKEN: ${{ steps.app.outputs.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          assert.ok(/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ID) && /^[1-9][0-9]*$/.test(process.env.SOURCE_RUN_ATTEMPT));
          const response = await fetch('https://api.github.com/repos/Allergy-Asthma-and-Sinus-Centers/preview.aascmed.com/actions/workflows/deploy-preview.yml/dispatches', {
            method: 'POST', redirect: 'error', signal: AbortSignal.timeout(10000),
            headers: { Authorization: `Bearer ${process.env.PREVIEW_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
            body: JSON.stringify({ ref: 'main', inputs: { component: 'astro', run_id: process.env.SOURCE_RUN_ID, run_attempt: process.env.SOURCE_RUN_ATTEMPT } }),
          });
          assert.ok(response.ok, 'Preview deployment request failed');
          JS
