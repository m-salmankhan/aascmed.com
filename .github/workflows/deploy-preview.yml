# Build only. Provisioning and deployment are explicit, separate manual operations.
name: Build preview image for review
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR for main or manual builds
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build compiled preview image
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: preview-server/Dockerfile.astro
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-preview:${{ github.sha }}
          build-args: |
            GATSBY_STRAPI_API_URL=${{ vars.GATSBY_STRAPI_API_URL }}
            STRAPI_MEDIA_ORIGINS=${{ vars.STRAPI_MEDIA_ORIGINS }}
            PUBLIC_RUNTIME_API_BASE_URL=${{ vars.PREVIEW_PUBLIC_RUNTIME_API_BASE_URL }}
            PUBLIC_MAPBOX_API_KEY=${{ vars.PREVIEW_PUBLIC_MAPBOX_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        run: echo "Built image digest ${{ steps.image.outputs.digest }}. Deployment is manual and requires Access provisioning." >> "$GITHUB_STEP_SUMMARY"
