# Private origin: no service publishes host ports. Run preflight before startup.
services:
  preview:
    container_name: aascmed-preview
    image: ${PREVIEW_IMAGE:?Set PREVIEW_IMAGE to an immutable image digest}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/_health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [preview-net]
    environment:
      NODE_OPTIONS: --max-old-space-size=700
      ASTRO_CONTENT_MODE: draft
      PREVIEW_FRAME_ORIGINS: ${PREVIEW_FRAME_ORIGINS:?Set the exact CMS editor origins}
      GATSBY_STRAPI_API_URL: ${GATSBY_STRAPI_API_URL:?Set CMS URL}
      STRAPI_TOKEN: ${STRAPI_TOKEN:?Set CMS token}

  caddy:
    container_name: preview-caddy
    image: docker.io/library/caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    command: ["caddy", "run", "--config", "/etc/caddy/config/Caddyfile", "--adapter", "caddyfile"]
    networks: [preview-net]
    environment:
      PREVIEW_FRAME_ORIGINS: ${PREVIEW_FRAME_ORIGINS:?Set the exact CMS editor origins}
    volumes:
      - ./caddy-config:/etc/caddy/config:ro,Z

  cloudflared:
    container_name: preview-cloudflared
    # Official 2026.10.5 image, pinned to the checked multi-platform manifest digest.
    image: docker.io/cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    restart: unless-stopped
    # Root in a rootless Podman namespace can read the deploy user's mode-600 file.
    user: "0:0"
    cap_drop: [ALL]
    read_only: true
    command: ["--config", "/etc/cloudflared/config.json", "tunnel", "--disable-path-normalization=false", "run"]
    networks: [preview-net]
    environment:
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:?Set the protected preview hostname}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:?Set the Cloudflare account ID}
      CLOUDFLARE_TEAM_NAME: ${CLOUDFLARE_TEAM_NAME:?Set the Access team name}
      CLOUDFLARE_ACCESS_AUD: ${CLOUDFLARE_ACCESS_AUD:?Set the Access application audience}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:?Set the tunnel ID}
    volumes:
      - ${TUNNEL_CONFIG_FILE:?Run tunnel preflight and set TUNNEL_CONFIG_FILE}:/etc/cloudflared/config.json:ro,Z
      - ${TUNNEL_CREDENTIALS_FILE:?Set tunnel credentials file}:/etc/cloudflared/credentials.json:ro,Z

networks:
  preview-net:
    driver: bridge
