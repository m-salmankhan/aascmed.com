# Preview Server — Docker Compose
#
# Runs three services on a shared network:
#   1. preview      — compiled Astro Node SSR (saved drafts)
#   2. forward-auth — Strapi-based login / JWT verification
#   3. caddy        — TLS reverse proxy with forward_auth
#
# Usage:
#   cp example.env .env    # fill in real values
#   mkdir -p caddy-config && cp Caddyfile caddy-config/Caddyfile
#   docker compose up -d   # start all services
#   docker compose logs -f # tail logs
#   docker compose down    # stop all services
#
# CI sets PREVIEW_IMAGE / AUTH_IMAGE to GHCR tags.
# For local dev, omit them and use `docker compose up -d --build`
# to build from source instead.

services:
  preview:
    container_name: aascmed-preview
    image: ${PREVIEW_IMAGE:-}
    build:
      context: ..
      dockerfile: preview-server/Dockerfile.astro
      args:
        GATSBY_STRAPI_API_URL: ${GATSBY_STRAPI_API_URL}
        STRAPI_MEDIA_ORIGINS: ${STRAPI_MEDIA_ORIGINS:-}
        PUBLIC_RUNTIME_API_BASE_URL: ${PUBLIC_RUNTIME_API_BASE_URL:-}
        PUBLIC_MAPBOX_API_KEY: ${PUBLIC_MAPBOX_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/_health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - preview-net
    environment:
      - NODE_OPTIONS=--max-old-space-size=700
      - ASTRO_CONTENT_MODE=draft
      - PREVIEW_FRAME_ORIGINS=${PREVIEW_FRAME_ORIGINS:-}
      - GATSBY_STRAPI_API_URL=${GATSBY_STRAPI_API_URL}
      - STRAPI_TOKEN=${STRAPI_TOKEN}

  forward-auth:
    container_name: preview-forward-auth
    image: ${AUTH_IMAGE:-}
    build:
      context: forward-auth
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - preview-net
    environment:
      - STRAPI_URL=${GATSBY_STRAPI_API_URL}

  caddy:
    container_name: preview-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - preview-net
    ports:
      - "${PREVIEW_HTTPS_PORT:-443}:443"
      - "${PREVIEW_HTTP_PORT:-80}:80"
    command: ["caddy", "run", "--config", "/etc/caddy/config/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy-config:/etc/caddy/config:ro
      - ${PREVIEW_CERTS_PATH:-./.certs}:/etc/caddy/certs:ro
    environment:
      - PREVIEW_DOMAIN=${PREVIEW_DOMAIN:-localhost}

networks:
  preview-net:
    driver: bridge
